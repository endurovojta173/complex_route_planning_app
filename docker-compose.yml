services:
  # Development service with Hot Module Replacement
  app-dev:
    build:
      context: .
      target: dev
    container_name: route_planner_dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  # Production service serving optimized bundle via Nginx
  app-prod:
    build:
      context: .
      target: production
    container_name: route_planner_prod
    ports:
      - "8080:80"
    restart: unless-stopped
